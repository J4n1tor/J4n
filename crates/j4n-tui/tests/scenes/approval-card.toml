[[step]]
down = "asks"
open = [{ ask = "q1", asker = "b", question = "which palette?", shape = "choice", options = [{ id = "jjj", label = "jjj" }, { id = "dusk", label = "dusk" }] }, { ask = "a2", asker = "b", question = "git push origin main?", shape = "approval", risk = 65, grants = ["task", "here"], wait = "0:21", why = "A push sends your commits out of this machine.", facts = [{ text = "origin", icon = "folder", tone = "dim" }], options = [{ id = "task", widens = true, by = "core" }, { id = "here", widens = true, by = "core" }] }]

