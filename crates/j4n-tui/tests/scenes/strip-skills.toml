bind = "chat:main"
total = 2
rev = 1
rows = [
  { key = "t1", cells = [{ text = "fix the parser so trailing commas work" }, { text = "", tone = "dim" }, { text = "12:29", tone = "dim" }] },
  { key = "la", cells = [{ text = "A work", icon = "working" }, { text = "", tone = "dim" }, { text = "0:12", tone = "dim" }], parent = "t1", data = { lane = { doer = "claude", own = true } } },
]

[[step]]
