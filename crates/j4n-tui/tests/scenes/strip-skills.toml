doc = "While a task runs with skills, the composer strip counts them (`2 skills`) beside the work bar. It is the first thing a short row gives up, so the doer · model stays at the right edge and nothing else of the right moves for it; no skills, no count."
sizes = [[120, 24], [80, 20], [60, 18]]

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
down = "tree"
node = { id = "root", title = "", present = "stack", children = [{ id = "chat", title = "", field = { kind = "chat", bind = "chat:main", props = { placeholder = "" } } }, { id = "bar", title = "", field = { kind = "bar", bind = "bar:main", props = { right = 2, drop = [1, 2] } } }] }

[[step]]
