doc = "Two or more questions open: the tray over the composer, one row each with the lane and the question and the marks of the answers; the one the keys are on opens in place; ↑↓ move, a digit answers, esc puts them off."
sizes = [[120, 32], [80, 24], [60, 20]]

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
down = "tree"
node = { id = "root", title = "", present = "stack", children = [{ id = "chat", title = "", field = { kind = "chat", bind = "chat:main", props = { placeholder = "fix the failing test in parser.rs" } } }, { id = "ask", title = "", field = { kind = "ask", bind = "asks:open", props = { one = "popup", many = "tray" } } }, { id = "bar", title = "", field = { kind = "bar", bind = "bar:main", props = { right = 2, drop = [1, 2] } } }] }

[[step]]
down = "rows"
bind = "chat:main"
total = 5
rev = 1
rows = [{ key = "t", cells = [{ text = "plan two ways to speed up the build, try the better one, review it" }, { text = "", tone = "dim" }, { text = "14:02", tone = "dim" }] }, { key = "r", cells = [{ text = "omp ▸ claude ▸ gemini", icon = "route" }, { text = "", tone = "dim" }], parent = "t" }, { key = "a", cells = [{ text = "A omp", icon = "ask" }, { text = "sonnet", tone = "dim" }, { text = "0:48", tone = "dim" }, { text = "$0.03", tone = "dim" }], parent = "t" }, { key = "b", cells = [{ text = "B claude", icon = "ask" }, { text = "sonnet", tone = "dim" }, { text = "b-claude", tone = "dim", icon = "worktree" }, { text = "0:12", tone = "dim" }, { text = "$0.01", tone = "dim" }], parent = "t" }, { key = "c", cells = [{ text = "C gemini", icon = "done" }, { text = "2.5-pro", tone = "dim" }, { text = "41s", tone = "dim" }, { text = "$0.04", tone = "dim" }], parent = "t" }]

[[step]]
down = "rows"
bind = "bar:main"
total = 1
rev = 1
rows = [{ key = "bar", cells = [{ text = "claude ▸ sonnet", tone = "accent", icon = "working" }, { text = "$0.14", tone = "dim" }, { text = "B", tone = "warn", icon = "ask" }, { text = "⇥ 1", tone = "accent" }, { text = "F1", tone = "dim" }] }]

[[step]]
down = "asks"
open = [{ ask = "q1", asker = "a", question = "which plan should claude build?", shape = "choice", wait = "4:10", options = [{ id = "1", label = "cache the dependency build in sccache", recommended = true, by = "model", note = "−60%" }, { id = "2", label = "split j4n-core into two crates", by = "model", note = "−25% · 40" }] }, { ask = "a1", asker = "b", question = "cargo build --release?", shape = "approval", risk = 40, wait = "0:12" }, { ask = "q3", asker = "c", question = "how useful was this review?", shape = "choice", options = [{ id = "1", label = "1" }, { id = "2", label = "2" }, { id = "3", label = "3" }, { id = "4", label = "4" }, { id = "5", label = "5" }] }, { ask = "q4", asker = "j4n", question = "name the new connector?", shape = "text" }]

[[step]]
shot = "tray"

[[step]]
key = "down"

[[step]]
shot = "approval"

[[step]]
key = "enter"

[[step]]
shot = "approval-enter"

[[step]]
key = "down"

[[step]]
shot = "score"

[[step]]
key = "down"

[[step]]
shot = "text"

[[step]]
key = "down"

[[step]]
shot = "wrapped"

[[step]]
key = "esc"

[[step]]
shot = "later"

[[step]]
text = "?"

[[step]]
shot = "back"
