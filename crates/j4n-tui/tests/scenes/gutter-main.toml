y = "lb0", cells = [{ text = "parser.rs", icon = "read" }, { text = "", tone = "dim" }], parent = "lb", merge = true }, { key = "lb1", cells = [{ text = "lexer.rs", icon = "read" }, { text = "", tone = "dim" }], parent = "lb", merge = true }, { key = "lb2", cells = [{ text = "args.rs", icon = "read" }, { text = "", tone = "dim" }], parent = "lb", merge = true }, { key = "lb3", cells = [{ text = "parser.rs", icon = "edit" }, { text = "", tone = "dim" }, { text = "+12 −3", tone = "accent" }], parent = "lb", detail = [{ text = "229 − if self.eat(Comma) { continue }" }, { text = "229 + if self.eat(Comma) && self.at(RParen) { break }" }] }, { key = "lb4", cells = [{ text = "cargo test parser", icon = "run" }, { text = "", tone = "dim" }, { text = "3.1s", tone = "good", icon = "done" }], parent = "lb", detail = [{ text = "running 14 tests" }, { text = "test args::case_1 ... ok" }, { text = "test args::case_2 ... ok" }, { text = "test args::case_3 ... ok" }, { text = "test args::case_4 ... ok" }, { text = "test args::case_5 ... ok" }, { text = "test args::case_6 ... ok" }, { text = "test args::case_7 ... ok" }, { text = "test args::case_8 ... ok" }, { text = "test args::case_9 ... ok" }, { text = "test args::case_10 ... ok" }, { text = "test args::case_11 ... ok" }, { text = "test args::trailing_comma ... ok" }, { text = "test result: ok. 14 passed; 0 failed" }] }, { key = "lb5", cells = [{ text = "syntax.md", icon = "edit" }, { text = "", tone = "dim" }, { text = "+4 −4", tone = "accent" }], parent = "lb" }, { key = "lb6", cells = [{ text = "Trailing commas now parse in argument lists and the docs show the new grammar." }, { text = "", tone = "dim" }], parent = "lb" }, { key = "lb7", cells = [{ text = "commit to b-claude?", icon = "ask" }, { text = "", tone = "dim" }, { text = "1", tone = "good", icon = "yes" }, { text = "2", tone = "bad", icon = "no" }, { text = "⇥ 1", tone = "accent" }], parent = "lb", by = "doer" }, { key = "lc", cells = [{ text = "C pi", icon = "queue