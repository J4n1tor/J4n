[[step]]
down = "rows"
bind = "bar:main"
total = 1
rev = 1
rows = [{ key = "bar", cells = [{ text = "claude ▸ sonnet", tone = "accent", icon = "working" }, { text = "$0.14", tone = "dim" }, { text = "B", tone = "warn", icon = "ask" }, { text = "⇥ 1", tone = "accent" }, { text = "F1", tone = "dim" }] }]

[[step]]
