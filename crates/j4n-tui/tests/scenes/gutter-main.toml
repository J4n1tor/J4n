value = { tags = [{ text = "parser.rs", icon = "tag", pct = 88 }, { text = "syntax.md", icon = "tag", pct = 81 }, { text = "plan-work-check", icon = "route", pct = 72 }], gauge = 0.41, route = "claude" }
