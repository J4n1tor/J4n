doc = "The main chat in the gutter look: one right-aligned word a row, no pipes — the letter and name of a doer, the verb of a step, `you` and `route`; the state of a lane at its right edge; output on a raised box under the text."
sizes = [[120, 40], [80, 24], [60, 20]]
theme = { frame = "gutter", marks = "words" }

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
down = "tree"
node = { id = "root", title = "", present = "stack", children = [{ id = "chat", title = "", field = { kind = "chat", bind = "chat:main", props = { placeholder = "fix the failing test in parser.rs" } } }, { id = "bar", title = "", field = { kind = "bar", bind = "bar:main", props = { right = 2, drop = [1, 2] } } }] }

[[step]]
down = "rows"
bind = "chat:main"
total = 25
rev = 1
