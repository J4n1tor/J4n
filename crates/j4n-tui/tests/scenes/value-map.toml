doc = "The map field in each state: focused, at rest, being edited, disabled, with a message. The narrow size puts the label above the value."
sizes = [[64, 24], [40, 30]]

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
down = "tree"
node = { id = "root", title = "", present = "stack", children = [
  { id = "a", title = "env", field = { kind = "map", bind = "cfg:map.a" } },
  { id = "off", title = "env", field = { kind = "map", bind = "cfg:map.off", props = { disabled = "read only" } } },
  { id = "bad", title = "env", field = { kind = "map", bind = "cfg:map.bad" } },
  { id = "b", title = "env", field = { kind = "map", bind = "cfg:map.b" } },
] }

[[step]]
down = "value"
bind = "cfg:map.a"
value = { RUST_LOG = "info", TOKEN = "" }
rev = 1

[[step]]
