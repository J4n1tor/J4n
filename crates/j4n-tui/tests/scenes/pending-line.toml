doc = "A look with marks on the pipes and no person icon. A line is a turn of the chat in the frame of the enter, with the track under it that draws its line to the next mark on the breath; the core's row takes its place; routed to a new chat the track says opening, then starting, and is gone when the chat runs. The line below the first is typed while it waits: the composer never stopped taking keys."
sizes = [[120, 30], [80, 24], [60, 20]]
theme = { marks = "icons", you = "mark", corners = "square", title_place = "border", fill = "terminal" }

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
down = "tree"
node = { id = "root", title = "", present = "stack", children = [{ id = "chat", title = "", field = { kind = "chat", bind = "chat:main", props = { placeholder = "" } } }, { id = "ask", title = "", field = { kind = "ask", bind = "asks:open", props = { one = "popup", many = "tray" } } }, { id = "bar", title = "", field = { kind = "bar", bind = "bar:main", props = { right = 2, drop = [1, 2] } } }] }

[[step]]
down = "rows"
bind = "chat:main"
total = 3
rev = 1
rows = [{ key = "t1", cells = [{ text = "rename the helper in lexer.rs" }, { text = "", tone = "dim" }, { text = "12:21", tone = "dim" }] }, { key = "r1", cells = [{ text = "→ c1 · same files · lexer.rs", tone = "dim" }, { text = "", tone = "dim" }], parent = "t1", by = "core" }, { key = "n1", cells = [{ text = "claude", icon = "done" }, { text = "sonnet", tone = "dim" }, { text = "9.8s", tone = "dim" }], parent = "t1" }]

[[step]]
text = "fix the parser so trailing commas work in every list\n"

[[step]]
shot = "sent"

[[step]]
wait = 500

[[step]]
shot = "t2"

[[step]]
wait = 1000

[[step]]
shot = "t6"

[[step]]
text = "and then the docs"

[[step]]
shot = "typing"

[[step]]
down = "rows"
bind = "chat:main"
total = 4
rev = 2
rows = [{ key = "t1", cells = [{ text = "rename the helper in lexer.rs" }, { text = "", tone = "dim" }, { text = "12:21", tone = "dim" }] }, { key = "r1", cells = [{ text = "→ c1 · same files · lexer.rs", tone = "dim" }, { text = "", tone = "dim" }], parent = "t1", by = "core" }, { key = "n1", cells = [{ text = "claude", icon = "done" }, { text = "sonnet", tone = "dim" }, { text = "9.8s", tone = "dim" }], parent = "t1" }, { key = "t2", cells = [{ text = "fix the parser so trailing commas work in every list" }, { text = "", tone = "dim" }, { text = "12:29", tone = "dim" }] }]

[[step]]
shot = "taken"

[[step]]
down = "rows"
bind = "chat:main"
total = 5
rev = 3
rows = [{ key = "t1", cells = [{ text = "rename the helper in lexer.rs" }, { text = "", tone = "dim" }, { text = "12:21", tone = "dim" }] }, { key = "r1", cells = [{ text = "→ c1 · same files · lexer.rs", tone = "dim" }, { text = "", tone = "dim" }], parent = "t1", by = "core" }, { key = "n1", cells = [{ text = "claude", icon = "done" }, { text = "sonnet", tone = "dim" }, { text = "9.8s", tone = "dim" }], parent = "t1" }, { key = "t2", cells = [{ text = "fix the parser so trailing commas work in every list" }, { text = "", tone = "dim" }, { text = "12:29", tone = "dim" }] }, { key = "r2", cells = [{ text = "→ c3 · new chat · none matched", tone = "dim" }, { text = "", tone = "dim" }], parent = "t2", by = "core" }]

[[step]]
shot = "routed"

[[step]]
down = "rows"
bind = "chats:list"
total = 1
