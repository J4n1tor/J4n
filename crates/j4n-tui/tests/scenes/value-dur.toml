doc = "The dur field in each state: focused, at rest, being edited, disabled, with a message. The narrow size puts the label above the value."
sizes = [[64, 24], [40, 30]]

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
down = "tree"
node = { id = "root", title = "", present = "stack", children = [
  { id = "a", title = "wall", field = { kind = "dur", bind = "cfg:dur.a" } },
  { id = "off", title = "wall", field = { kind = "dur", bind = "cfg:dur.off", props = { disabled = "read only" } } },
  { id = "bad", title = "wall", field = { kind = "dur", bind = "cfg:dur.bad" } },
  { id = "b", title = "wall", field = { kind = "dur", bind = "cfg:dur.b" } },
] }

[[step]]
