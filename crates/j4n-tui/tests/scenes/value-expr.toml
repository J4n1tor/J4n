doc = "The expr field in each state: focused, at rest, being edited, disabled, with a message. The narrow size puts the label above the value."
sizes = [[64, 24], [40, 30]]

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
down = "tree"
node = { id = "root", title = "", present = "stack", children = [
  { id = "a", title = "when", field = { kind = "expr", bind = "cfg:expr.a", props = { check = "3 of 40 last cmds" } } },
  { id = "off", title = "when", field = { kind = "expr", bind = "cfg:expr.off", props = { check = "3 of 40 last cmds", disabled = "read only" } } },
  { id = "bad", title = "when", field = { kind = "expr", bind = "cfg:expr.bad", props = { check = "3 of 40 last cmds" } } },
  { id = "b", title = "when", field = { kind = "expr", bind = "cfg:expr.b", props = { check = "3 of 40 last cmds" } } },
] }

[[step]]
down = "value"
bind = "cfg:expr.a"
value = "danger(cmd).class == 'push'"
rev = 1

[[step]]
down = "value"
bind = "cfg:expr.off"
value = "danger(cmd).class == 'push'"
rev = 1

[[step]]
down = "value"
bind = "cfg:expr.bad"
value = "dangr("
rev = 1

[[step]]
down = "value"
bind = "cfg:expr.b"
value = "danger(cmd).class == 'push'"
rev = 1

[[step]]
shot = "focused"

[[step]]
key = "down"

[[step]]
key = "down"

[[step]]
shot = "idle"

[[step]]
key = "up"

[[step]]
key = "up"

[[step]]
key = "enter"
