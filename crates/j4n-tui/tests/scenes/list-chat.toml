doc = "Settings › Chat: the same pipe list as the other sub-tabs, with titles; the row is changed with ⏎, which the keys row says, not the row."
sizes = [[60, 10], [80, 12], [120, 12]]

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
