doc = "One turn, five lanes, in the gutter look: a failed lane stays open, older settled lanes fold, a retry, a rate limit, unmapped output."
sizes = [[120, 44], [80, 36], [60, 30]]
theme = { frame = "gutter", marks = "words" }

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
down = "tree"
node = { id = "root", title = "", present = "stack", children = [{ id = "chat", title = "", field = { kind = "chat", bind = "chat:main", props = { placeholder = "" } } }, { id = "bar", title = "", field = { kind = "bar", bind = "bar:main", props = { right = 2, drop = [1, 2] } } }] }

