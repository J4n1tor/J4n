  { key = "t6", cells = [{ text = "from main: the parser work, resumed on sonnet" }, { text = "", tone = "dim" }, { text = "13:02", tone = "dim" }], data = { from = "main" } },
  { key = "l6", cells = [{ text = "A work", icon = "done" }, { text = "", tone = "dim" }, { text = "0:30", tone = "dim" }], parent = "t6", data = { lane = { doer = "claude", own = true } } },
  { key = "l60", cells = [{ text = "parser.rs", icon = "read" }, { text = "", tone = "dim" }], parent = "l6" },
