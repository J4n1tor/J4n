[[step]]
down = "value"
bind = "composer:strip"
value = { tags = [{ icon = "tasks", text = "lanes single" }], gauge = 0.18, route = "claude · claude-haiku-5-5", route_by = "core" }
rev = 1

[[step]]
down = "rows"
bind = "bar:main"
total = 1
rev = 1
rows = [{ key = "bar", cells = [{ text = "idle", tone = "accent" }, { text = "write", tone = "plain" }, { text = "$0.33", tone = "dim" }, { text = "demo", tone = "dim" }] }]
