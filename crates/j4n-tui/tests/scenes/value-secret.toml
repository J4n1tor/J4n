doc = "The secret field in each state: focused, at rest, being edited, disabled, with a message. The narrow size puts the label above the value."
sizes = [[64, 24], [40, 30]]

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
down = "tree"
node = { id = "root", title = "", present = "stack", children = [
  { id = "a", title = "token", field = { kind = "secret", bind = "cfg:secret.a" } },
  { id = "off", title = "token", field = { kind = "secret", bind = "cfg:secret.off", props = { disabled = "read only" } } },
  { id = "bad", title = "token", field = { kind = "secret", bind = "cfg:secret.bad", props = { error = "env:CLAUDE_KEY unset" } } },
  { id = "b", title = "token", field = { kind = "secret", bind = "cfg:secret.b" } },
] }

[[step]]
down = "value"
bind = "cfg:secret.a"
value = true
rev = 1

[[step]]
down = "value"
bind = "cfg:secret.off"
value = true
rev = 1

[[step]]
down = "value"
bind = "cfg:secret.bad"
value = false
rev = 1

[[step]]
down = "value"
bind = "cfg:secret.b"
value = true
rev = 1

[[step]]
shot = "focused"

[[step]]
key = "down"

[[step]]
key = "down"

[[step]]
shot = "idle"

[[step]]
key = "up"

[[step]]
key = "up"

[[step]]
key = "enter"

[[step]]
text = "xxxxxxxx"
