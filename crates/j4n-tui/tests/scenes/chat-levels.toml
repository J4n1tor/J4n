doc = "A level is three cells and every icon has its space; rows end one cell before the edge; your line is a raised band with the time at its right and a blank row above; what the doer says about the run is a band after the turn's tree, in words, said once; a lane on the thread's own doer says its step and not its doer."
sizes = [[120, 36], [80, 30], [60, 26]]

[[step]]
down = "hello"
api = 1
name = "j4n"
version = "0.0.0"
project = "demo"

[[step]]
down = "tree"
node = { id = "root", title = "", present = "stack", children = [{ id = "chat", title = "", field = { kind = "chat", bind = "chat:main", props = { placeholder = "" } } }, { id = "bar", title = "", field = { kind = "bar", bind = "bar:main", props = { right = 2, drop = [1, 2] } } }] }

[[step]]
down = "rows"
bind = "chat:main"
total = 16
rev = 1
rows = [{ key = "t1", cells = [{ text = "fix the parser so trailing commas work, update the docs, then check it" }, { text = "", tone = "dim" }, { text = "12:29", tone = "dim" }] }, { key = "la", cells = [{ text = "A omp", icon = "done" }, { text = "sonnet", tone = "dim" }, { text = "", tone = "dim", icon = "read-only" }], parent = "t1" }, { key = "la0", cells = [{ text = "parser.rs", icon = "read" }, { text = "", tone = "dim" }], parent = "la" }, { key = "lb", cells = [{ text = "B work", icon = "done" }, { text = "", tone = "dim" }, { text = "b-claude", tone = "dim", icon = "worktree" }, { text = "2:01", tone = "dim" }, { text = "$0.19", tone = "dim" }], parent = "t1" }, { key = "lb0", cells = [{ text = "parser.rs", icon = "read" }, { text = "", tone = "dim" }], parent = "lb", merge = true }, { key = "lb1", cells = [{ text = "lexer.rs", icon = "read" }, { text = "", tone = "dim" }], parent = "lb", merge = true }, { key = "lb2", cells = [{ text = "parser.rs", icon = "edit" }, { text = "", tone = "dim" }, { text = "+3 −7", tone = "dim" }], parent = "lb" }, { key = "lb3", cells = [{ text = "cargo test", icon = "run" }, { text = "", tone = "dim" }, { text = "", tone = "dim", icon = "yes" }, { text = "9.2s", tone = "dim" }], parent = "lb", detail = [{ text = "running 14 tests" }, { text = "test result: ok. 14 passed" }] }, { key = "lbn", cells = [{ text = "claude · 80% of the 5-hour limit used · resets 14:20", icon = "notice", tone = "warn" }, { text = "", tone = "dim" }], parent = "lb", by = "doer" }, { key = "lbn2", cells = [{ text = "claude · 80% of the 5-hour limit used · resets 14:20", icon = "notice", tone = "warn" }, { text = "", tone = "dim" }], parent = "lb", by = "doer" }, { key = "lbp", cells = [{ text = "Trailing commas now parse, and the docs say so." }, { text = "", tone = "dim" }], parent = "lb", by = "doer" }, { key = "lbn3", cells = [{ text = "retried once after a refused connection; the model was switched to claude-haiku-5-5 for the rest of the run", icon = "notice", tone = "dim" }, { text = "", tone = "dim" }], parent = "lb", by = "doer" }, { key = "k1", cells = [{ text = "claude-7c1 · resumes 4f2a", icon = "session" }, { text = "", tone = "dim" }], parent = "t1", by = "core" }, { key = "t2", cells = [{ text = "thanks" }, { text = "", tone = "dim" }, { text = "12:41", tone = "dim" }] }, { key = "lc", cells = [{ text = "C", icon = "working" }, { text = "", tone = "dim" }, { text = "0:22", tone = "dim" }, { text = "$0.02", tone = "dim" }], parent = "t2" }, { key = "lc0", cells = [{ text = "README.md", icon = "read" }, { text = "", tone = "dim" }], parent = "lc" }]

[[step]]
down = "value"
bind = "composer:strip"
value = { tags = [{ icon = "tasks", text = "lanes single" }], gauge = 0.18, route = "claude · claude-haiku-5-5", route_by = "core" }
rev = 1

[[step]]
down = "rows"
bind = "bar:main"
total = 1
rev = 1
rows = [{ key = "bar", cells = [{ text = "C working", tone = "accent" }, { text = "write", tone = "plain" }, { text = "$0.33", tone = "dim" }, { text = "demo", tone = "dim" }] }]

[[step]]
