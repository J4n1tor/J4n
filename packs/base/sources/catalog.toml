api = 1

# The harnesses J4n drives and where their releases are: the feed each has, checked on 2026-10-29, and the
# binary installed here. A row follows a connector only while that connector is declared. pi and omp have no known home yet: a row
# of the operator's gives one.
[[source]]
id = "claude-code"
doc = "Claude Code's releases."
of = "connector:claude"
adapter = "atom"
url = "https://github.com/anthropics/claude-code/releases.atom"
tier = "hot"

# The models Claude Code routes to (haiku, sonnet, opus), as models.dev lists them: one request a day that is a 304 of no bytes while
# nothing changed. A model that goes or changes its cost, limits or powers breaks what routes to it.
[[source]]
id = "claude-models"
doc = "The Claude models Claude Code routes to, as models.dev lists them."
of = "connector:claude"
adapter = "models"
url = "https://models.dev/api.json"
watch = "ids:anthropic"
tier = "cold"

# Claude Code's docs, as the pages its llms.txt lists: a page that is added, gone or described differently is news.
[[source]]
id = "claude-docs"
doc = "The pages of Claude Code's documentation."
of = "connector:claude"
adapter = "page"
url = "https://code.claude.com/docs/llms.txt"
tier = "cold"

[[source]]
id = "claude-bin"
doc = "The claude installed here."
of = "connector:claude"
adapter = "probe"
program = "claude"
tier = "hot"

