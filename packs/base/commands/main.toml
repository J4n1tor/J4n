api = 1

# What the operator can ask for by name, beyond the words of the phrase table: a page to open, the packs.

[[command]]
id = "pack"
doc = "List the packs: which are on, which were left out and why."
words = [":pack", ":packs"]
complete = ["on|off|ready", "pack"]
core = "pack"

[[command]]
id = "lanes"
doc = "Say what acts on its own, or set it: `single` (a line is a task), `auto` (the plan keeper and scout and review branches), `wide` (also pieces in held worktrees) or `orchestrate` (Main, its chats and the crew: the one switch). Settings › All › lanes does the same, and `u` there takes it back."
words = [":lanes"]
core = "lanes"

[[command]]
id = "grant"
doc = "The grants you gave that still count (once, this task, this session, always here): `:grant` lists them, `:grant back <id>` takes one back, and the thing is asked again. Settings › Gates `x` does the same."
words = [":grant", ":grants"]
args = ["back", "id"]
core = "grant"

[[command]]
id = "key"
doc = "Remove a provider's key that J4n keeps: `:key remove own`. Library › Providers `x` does the same, on the card. A key is typed on its row there (`⏎`), never on a line: a line is kept in the Log."
words = [":key"]
args = ["remove", "connector"]
core = "key"

[[command]]
id = "calibrate"
doc = "Say what a request has to cost to teach J4n what a window of your plan is worth, and, with `yes`, run it. It spends part of the window, so it never runs by itself."
words = [":calibrate"]
core = "calibrate"

[[command]]
id = "usage"
doc = "Show where each subscription's windows stand (used, reset, pace, when it runs out at that pace) and what each gateway was spent today, as bars in the chat that stay up to date. Answered from the Log: no doer, no model."
words = [":usage", "/usage"]
core = "usage"

[[command]]
id = "context"
doc = "Show what each chat's doer holds and what the next line costs: per `doer · model`, how full its window is, the session's floor (what its first turn read before any word) and history (what it has grown by), and whether the next line finds the provider's cache warm or cold, as a row in the chat that stays up to date. Answered from the Log: no doer, no model."
words = [":context", "/context"]
core = "context"

[[command]]
id = "resume"
doc = "Take the session the last change left back: the next line, once, carries on in the doer's old session and not in the new one `session.mode` began. With no change to undo, it keeps the session there is for the next line even if `auto` would have ended it. `:fresh` forgets it."
words = [":resume"]
core = "resume"

[[command]]
id = "compact"
doc = "Shrink this chat's doer session now, at a settled boundary (or at the next one when a task runs: law 9, never mid-turn): plain, `junk` (drop tool output nothing reads again, failed tries, repeats) or `keep <words>`. The doer's own compaction does it; one with none says so and nothing changes. `/context` shows before and after."
words = [":compact", "/compact"]
args = ["mode"]
core = "compact"

[[compact_mode]]
id = "plain"
doc = "Shrink the session as the doer would, keeping what must stay."

[[compact_mode]]
id = "junk"
doc = "Drop what nothing reads again: tool output nothing later uses, failed tries and repeats."
words = "Drop tool output that nothing later reads, failed tries and repeats; keep what was decided and what is left to do."

[[compact_mode]]
id = "keep"
doc = "Keep what the words name."
words = "Keep what these words name, in full if it fits: {words}"
takes = true

[[command]]
id = "chart"
doc = "Show a chart as a row of the chat that stays up to date: `spend` (a day's dollars and tokens), `wall` (task time), `bench` (how the cases pass) or `lanes` (branches a line). Answered from the Log: no doer, no model."
words = [":chart", "/chart"]
args = ["name"]
core = "chart"

[[command]]
id = "term"
doc = "Show the row of the project's docs that an id in an answer stands for (`ADR-12`, `BUG-7`): its words, the doc and the line, and the row as written."
words = [":term"]
args = ["id"]
core = "term"

[[command]]
id = "watch"
doc = "Say what the tools J4n follows stand at (running, latest, tested), from what it knows; with `once`, ask them now, quietly, and say what changed (Grow › Updates `r`). It does nothing while `watch.upstream` is off."
words = [":watch"]
core = "watch"

[[command]]
id = "trust"
doc = "Show how far each machine answerer is trusted."
open = "trust"

[[command]]
id = "config"
doc = "Show every setting and what it holds."
words = [":config", ":settings"]
open = "config"

[[command]]
id = "proposals"
doc = "Show what J4n has proposed for itself, to accept or decline."
words = [":proposals"]
open = "proposals"

[[command]]
id = "roster"
doc = "Show the Agents sub-tab of the Connect tab: the agents first, then the tools, services, MCP servers and deciders."
words = [":roster"]
open = "agents"

[[command]]
id = "setup"
doc = "Open Connect › Setup: the agent, the model and the Decider, each with where it stands and the key that sets it, a key typed on its row and shown to no one (`:setup again` asks the programs again, `:setup test` makes one short call to each part that is set, `:setup doer <id>` picks the main lane's doer)."
words = [":setup", ":doctor"]
open = "setup"

[[command]]
id = "signin"
doc = "Sign a program in with its own login, in its own folder (no account is made): `:signin claude`. J4n starts the program's sign-in, shows the link it gives and asks before it runs; Connect › Setup has it as `s` on the program's row."
words = [":signin"]
flow = "signin"
args = ["the program"]

[[command]]
id = "plans"
doc = "Show the plan rows and their prices."
words = [":plans"]
open = "plans"

[[command]]
id = "providers"
doc = "Show Library › Providers: the connectors that speak a provider's API, and where each one's key comes from (never the key). `⏎` on a row types its key, `x` removes it."
words = [":providers"]
open = "providers"

[[command]]
id = "library"
doc = "Show the models there are and how each is had."
words = [":library", ":models"]
open = "library"

[[command]]
id = "look"
doc = "Say how the screen looks (palette, marks, frame, corners, title_place, density, motion, mouse); it is written for this project and changes at once."
words = [":look"]
args = ["part", "word"]
complete = ["word:look", "word:look"]
core = "look"

[[command]]
id = "plan"
doc = "Show the plan of the thread, edit it (`drop`, `state`, `set`, `add`; an edit wins over the planner), or begin one from the words after it. `replace` says yes to a new plan."
words = [":plan"]
args = ["words"]
core = "plan"

[[command]]
id = "new"
doc = "Start a new chat (chats.on): `:new` opens one and goes into it, `:new <words>` opens one, sends it the words, and leaves you where you are. With the chats off it is `:fresh`, as it was."
words = [":new"]
args = ["words"]
core = "new"

[[command]]
id = "clear"
doc = "Empty what this chat shows and nothing else (chats.on): the Log keeps every row, it is a chain, and `:history` brings them back. In the orchestrator it empties its rows and not the list of chats."
words = [":clear", "/clear"]
core = "clear"

[[command]]
id = "history"
doc = "Bring back the rows `:clear` emptied in this chat (chats.on)."
words = [":history"]
core = "history"

[[command]]
id = "archive"
doc = "Tidy the list of the chats (chats.on): `:archive c3` archives that chat, in a chat `:archive` archives it, and in the orchestrator `:archive` or `/archive` archives every chat J4n's own rules pick (its turns over and ok, nothing waiting, cooling or queued, no open plan item, idle for `chats.archive.idle`), saying which in one line first; no model is asked. A chat that runs, cools or waits for you is not archived, and the orchestrator never is. The archive is the last row of the list, closed; a line typed in an archived chat brings it back."
words = [":archive", "/archive"]
args = ["chat"]
complete = ["chat"]
core = "archive"

[[command]]
id = "unarchive"
doc = "Take a chat out of the archive (chats.on): `:unarchive c3`."
words = [":unarchive"]
args = ["chat"]
complete = ["chat"]
core = "unarchive"

[[command]]
id = "chats"
doc = "List the chats, the ones that wait for you first (chats.on): `⏎` goes into one, `esc` closes the list."
words = [":chats"]
core = "chats"

[[command]]
id = "top"
doc = "Go to the orchestrator, the top of the chats (chats.on)."
words = [":top"]
core = "top"
