api = 1

# Anything outside, connected the same way: an agent CLI, a terminal command used as a tool, a protocol
# server. The `dialect` is how J4n talks to it; it is one of a closed set, and a dialect is the rare change to the core. Everything
# else is data, so a program J4n has never seen is a file here and no Rust. A connector names a program: only the user's own
# layer and the packs may write one (a project that was cloned from a stranger may not), and an argument that holds a value J4n
# fills in is written `{prompt}`, `{model}`, `{session}`, `{cwd}` or, for a tool, the name of one of its `args`.
[[kind]]
id = "connector"
doc = "A program or a protocol server J4n can start, and the dialect it is spoken to in."
untrusted = "ignore"
examples = [
  { id = "newagent", doc = "A JSONL-streaming agent CLI, mapped to J4n's events by data.", is = "agent", dialect = "jsonl-map", program = "newagent", start = ["run", "--json", "{prompt}"], map = { session = "/session_id", end = "/type == 'result'", events = [{ when = "/type == 'text'", emit = "text", text = "/text" }] } },
  { id = "ripgrep", doc = "A terminal command as a tool.", is = "tool", dialect = "text", program = "rg", argv = ["rg", "--line-number", "{pattern}", "{path}"], args = [{ name = "pattern", required = true }, { name = "path", default = "." }], risk = "read" },
]

[kind.fields]
doc = { ty = "text", doc = "What it is." }
is = { ty = "enum:agent|tool|service|model|decider|mcp", required = true, doc = "What kind of thing it is: only an `agent` can be a thread's doer; a `tool` is run for its output." }
dialect = { ty = "enum:text|json-last|jsonl-map|acp|claude-stream|pi-rpc|test|mcp|http-json|openai|anthropic|systemone|decisions|builtin", required = true, doc = "How it is spoken to." }
url = { ty = "str", doc = "For `openai`, `anthropic`, `systemone` and `decisions`: the base URL the calls go to (`https://openrouter.ai/api/v1`, `https://api.anthropic.com`). Calls leave through the one builder, behind the system's proxy or `proxy`." }
key = { ty = "secret", doc = "For those dialects: where the API key is kept (`env:NAME` or `file:/path`), read when it is used and never written down. With none, a model is a doer that is not logged in, and a decider or a model answerer is not made: the points answer by their rules, their rank or their fallback." }
proxy = { ty = "str", doc = "For those dialects: `system` (the default) or an account's proxy URL, which replaces the system's for this connector." }
system = { ty = "text", doc = "For `openai` and `anthropic` as a doer: the system prompt." }
context = { ty = "int", min = 1, doc = "For those: the window in tokens, to say how full it is." }
effort = { ty = "enum:low|medium|high", doc = "For those: how much a model that reasons may think." }
zone = { ty = "enum:any|trusted|local", doc = "For a decider or a model that answers questions: where its provider is, which the egress Gate checks against the class of the data (`local` for a model on this machine)." }
keyless = { ty = "bool", default = false, doc = "A model that needs no key (one on this machine)." }
brief = { ty = "bool", default = false, doc = "For the dialect `test`: the scripted doer takes a Brief with each line, as a model does (a test reads what a turn was given)." }
tools = { ty = "list<str>", default = [], doc = "For a model that works on its own (`openai`, `anthropic`): the ids of the connectors with the dialect `builtin` whose tools it is given (`list`, `read`, `grep`, `edit`, `write`, `run`, `git`). Every turn offers the same tools; a task that only reads keeps them, and the Gate asks or blocks when one would change something." }
program = { ty = "str", doc = "The program to run, found on the PATH when it has no slash. Without it the connector has no process (the `test` dialect)." }
candidates = { ty = "list<str>", doc = "Programs to look for, in order, a path or a name on the PATH: the first one on this machine stands where `{found}` is in `probe.argv` and `start` (the browser of account windows)." }
family = { ty = "enum:pi|omp", doc = "For `pi-rpc`: which of the two the program is (they differ in how they say ready and in what ends a turn)." }
probe = { ty = "obj", fields = { argv = "argv", auth = "argv", signed = "list<str>" }, doc = "How to find out it is there and usable: `argv` prints the version (the first word of its first line), `auth` ends with exit 0 when it is logged in, `signed` lists what shows a login when no command does (`~/path` exists under the home, `$NAME` is set; any one will do). Left out: the program must run `--version`, and is taken to be logged in." }
start = { ty = "list<str>", doc = "The arguments after the program that start a run. `jsonl-map` and `text` put the goal in with `{prompt}`; an argument whose value is not there is left out together with the flag before it." }
resume = { ty = "list<str>", doc = "Added to `start` to carry on in a session: `{session}` is its id. Left out: the connector cannot carry on." }
model = { ty = "list<str>", doc = "Added when the task names a model: `{model}` is its name." }
modes = { ty = "map<list<str>>", doc = "The arguments for a task that only reads (`read`) and one that may change things (`write`)." }
oneshot = { ty = "list<str>", doc = "For `pi-rpc`: the arguments of a run that is not live, used when the program will not speak RPC (the goal is `{prompt}`)." }
guard = { ty = "obj", fields = { kind = { ty = "str", required = true, doc = "Whose permission config J4n makes: `opencode`." }, env = { ty = "str", required = true, doc = "The variable that carries the config (`OPENCODE_CONFIG_CONTENT`): it outranks the operator's own and the project's, and no file is written." }, args = { ty = "list<str>", doc = "Words put in front of the prompt, only with the config (`--auto` answers what the config leaves to ask)." }, allow = { ty = "list<str>", doc = "Rules allowed at both levels, beyond what the gate's tables give." }, deny = { ty = "list<str>", doc = "Rules denied at both levels, after every allow." }, full_allow = { ty = "list<str>", doc = "Allowed only under `--approval full`. A `git ` rule is made for `--no-pager`, `-c core.pager=cat` and `-C <dir>` too." }, full_deny = { ty = "list<str>", doc = "Denied under `--approval full`, after everything." }, boxed_allow = { ty = "list<str>", doc = "Allowed under `--approval full` only when the task runs behind the box (the deletes: the wall leaves only the project and the program's own state writable), after everything else." }, full_exact = { ty = "list<str>", doc = "Allowed under `--approval full` as written, with no argument after them (`python3`, `git config core.hooksPath`): the other lists stand for the command with any arguments." } }, doc = "For a program with permission rules of its own (`opencode`): the config J4n makes for each task from the gate's tables (what only reads, the test runners, the forms of a reader that are refused, the credential paths) and these rows, so the program is never started with a bare `--auto`." }
profile = { ty = "obj", fields = { full = { ty = "obj", fields = { args = "list<str>", env = "map<str>" } }, lean = { ty = "obj", fields = { args = "list<str>", env = "map<str>" } }, lean_for = "list<str>", project = { ty = "obj", fields = { args = "list<str>", env = "map<str>" } } }, doc = "For `claude-stream`: what a child is started with for one job, beyond `modes`: `full` (work in the project: what the tool loads by itself) and `lean` (a chore, a light line, a decider: the least that still answers), each `args` (flags) and `env` (added to the environment); `lean_for` are the roles that take `lean` when the setting `profile` is `auto`; `project` is added to every child while the setting `doer.scope` is `project` (the project's own settings and no user settings, plugins, MCP servers or tools that reach other sessions)." }
env = { ty = "map<str>", doc = "Added to the environment the child inherits. Not for secrets." }
secrets = { ty = "map<secret>", doc = "Environment variables whose values are read from a reference (`env:NAME`, `file:/path`, or `kept:<provider>`: the key J4n keeps for that provider, given only to a program the setting `doer.keys` names) when the child is started, and never written down. A child inherits no key variable of J4n's own environment (a name that ends in `_KEY`, `_TOKEN`, `_SECRET` or `_PASSWORD`) but those its row names here or as a `$NAME` of `probe.signed`, which it is given as the operator set them where the reference gives nothing." }
pass = { ty = "list<str>", doc = "The key variables of the operator's own environment the program reads by itself (`CLAUDE_CODE_OAUTH_TOKEN`, a provider's `*_API_KEY`): its child is given them as the operator set them. A key variable no row names (here, in `secrets` or in `probe.signed`) and the setting `keys.pass` does not list reaches no program J4n starts." }
login = { ty = "list<str>", doc = "Where the program keeps its login and its own state, as `~/…` paths (`~/.claude`, `~/.claude.json`). A task behind a box (place `box`) has them writable, because the program refreshes its login and writes its session there, and nothing else of the home." }
net = { ty = "bool", doc = "`false`: a tool of this connector runs with the network cut where a box can cut it (place `box`; the box row's `no_net` words), whatever the setting `box.net` says. Left out, `box.net` decides. A place that is not a box cannot cut it." }
models = { ty = "list<str>", doc = "The models it offers, for the chooser." }
list = { ty = "obj", fields = { argv = "argv" }, doc = "More models than `models` names, asked of the program: `argv` is run once a day and when a model word matches none, and each line it prints names a model (the `model` column of a table with a header, else the first word). An `openai` connector with a `url` is asked its `/models` instead." }
roles = { ty = "list<str>", doc = "What it is good for: `plan`, `work`, `review`, `validate`." }
args = { ty = "list", of = { ty = "obj", fields = { name = { ty = "str", required = true }, required = "bool", default = "str" } }, doc = "For a tool: the arguments it takes, each a `name`, and `required` or a `default`. A goal that is a JSON object fills them by name; any other goal is `{prompt}`." }
argv = { ty = "argv", doc = "For a tool: the whole command line, with `{name}` for each of its `args`. For an agent learned by trying (`jsonl-map`): the program and every argument, with `{prompt}` where the goal goes and `{session}` where a session id goes." }
stdin = { ty = "str", doc = "For `jsonl-map`: the text written to the program's standard input (`{prompt}`), for a program that reads its prompt there. Left out: nothing is written." }
gated = { ty = "bool", doc = "Each run of the program goes to the Gate first in write mode, as a tool's does: for a program that writes without asking and whose permissions J4n cannot set (one learned by trying). In read mode the walls hold it and nothing is asked." }
serve = { ty = "obj", fields = { ready = "str", path = "str", body = "str", resume = "str" }, doc = "For `jsonl-map`: the program is a local server. `argv` starts it; a line it prints that holds `ready` names its address; each task posts `body` (JSON, `{prompt}` escaped for it; `resume` when it carries on in a session, with `{session}` too) to `path` there and reads the reply as the program's lines, and the server is taken down after the answer." }
decode = { ty = "list<str>", doc = "For `jsonl-map`: what a line is before it is JSON, in order: `ansi` (colour codes, redraws, spinners), `sse` (the `data:` of server-sent events), `frames` (a length before each JSON line), `logfmt` (`k=v` pairs), `colon` (`key: value` lines, and every line as `line`, `head`, `tail`) and `plain` (every line as `line`). Left out: each line is JSON." }
says = { ty = "enum:read|write|net|exec", doc = "For a tool learned by trying: what the program's own words say a run of it does. The Gate warns by the greater of this and `risk`." }
risk = { ty = "enum:read|write|net|exec", default = "exec", doc = "For a tool: what running it can do, which the Gate reads before it is run." }
map = { ty = "obj", doc = "For `jsonl-map`: how each line of the program's output becomes what J4n shows. Every expression reads the line as a JSON document (`/usage/cost_usd`, `/type == 'result'`).", fields = { session = { ty = "expr", roots = [] }, end = { ty = "expr", roots = [] }, answer = { ty = "expr", roots = [] }, cost = { ty = "expr", roots = [] }, error = { ty = "expr", roots = [] }, tokens_in = { ty = "expr", roots = [], doc = "The input tokens a line says were used, without the cache parts." }, tokens_out = { ty = "expr", roots = [], doc = "The output tokens (`sum([/a, /b])` adds reasoning to them)." }, cached = { ty = "expr", roots = [], doc = "The part read from the cache." }, wrote = { ty = "expr", roots = [], doc = "The part written to the cache." }, rejects = { ty = "list<str>", doc = "Words (any case) of the program's stderr that say it refused a tool: a run that ends on a tool, or never ends, says that line as its reason." }, refused = { ty = "list<str>", doc = "Words (any case) of a tool's error that say the program's own rules refused it and whose text is those rules: the run says one sentence in its place." }, events = { ty = "list", of = { ty = "obj", fields = { when = { ty = "expr", roots = [], required = true }, emit = { ty = "enum:text|reasoning|message|tool|tool_end|shell|error|notice|changed|tool_error", required = true }, text = { ty = "expr", roots = [] }, name = { ty = "expr", roots = [] }, detail = { ty = "expr", roots = [] }, cmd = { ty = "expr", roots = [] }, out = { ty = "expr", roots = [] }, exit = { ty = "expr", roots = [] } } } } } }
off = { ty = "bool", default = false, doc = "The operator turned the connection off (Connect › Overview, `o`): the row stays as it is and is left out of the doers, the choosers and the tools at the next start. `o` again turns it on." }
limits = { ty = "list", of = { ty = "obj", fields = { line = { ty = "str", doc = "The shape of a line of the program's output that says its limit, with holes: `{used}`, `{left}`, `{cap}`, `{percent}`, `{reset}` (a time to wait, `4m10s`), `{unit}`, `{window}`, `{n}` (any number), `{*}` (anything)." }, used = "str", left = "str", cap = "str", percent = "str", reset = "str", reset_at = "str", unit = "str", window = "str", command = "list<str>", path = "str" } }, default = [], doc = "Where the program says how much of its own usage limit is used and when it ends, read into the same gauges and the same limited state as a login's windows. A row reads a line by its shape (`line`), or the keys of a JSON object a line holds (`used`, `left`, `cap`, `percent` the numbers; `reset` the seconds to wait or a time like `4m10s`; `reset_at` the time it ends), or runs a subcommand after each turn (`command`, read the same way), or reads a file in the project (`path`). A program that refuses for its limit is read with no row: it says how long to wait, and the wait is its own." }
canary = { ty = "obj", fields = { goal = "str", expect = "str", argv = "argv" }, doc = "What the Connect flow runs once before it proposes the connector: the `goal` to give it (for a tool, a harmless example of its arguments; for an agent, left out, it is asked to say the word ready), `argv`, for a tool, the arguments of a run that has no effect (`--help`, `--version`) that is made in place of the goal, and `expect`, a word the answer must hold." }
method = { ty = "enum:get|post|put|patch|delete", doc = "For `http-json`: the HTTP method; left out, `get`." }
headers = { ty = "map<str>", default = {}, doc = "For `http-json`: the headers, each value a template over the `args`; `{key}` stands for the connector's key here and nowhere else." }
body = { ty = "text", doc = "For `http-json`: the JSON document sent, with `{name}` where an argument goes (it is put in as a JSON string's inside)." }
result = { ty = "str", doc = "For `http-json`: where in the JSON answer the words are, a pointer such as `/choices/0/text`; left out, the whole body is the answer." }
signin = { ty = "obj", fields = { argv = "argv", again = "argv", env = "map<str>", page = "str", share = "list<str>", wait_secs = { ty = "int", min = 1, doc = "The same limit in seconds, for a sign-in that is known to be quick; it wins over `wait`." }, check = { ty = "obj", fields = { argv = "argv", ok = "str", email = "str", plan = "str" }, doc = "Run as the account after the login ends, to see who it is signed in as: `ok`, `email` and `plan` are JSON pointers into what it prints (without `ok`, exit 0 is a yes)." }, wait = "int" }, doc = "How the program is signed in to as an account: `argv` is the login, run with `env` (`{account.home}` and `{account.dir}` stand for the account's folders), `again` is added on a second sign-in, `page` is where the account's window opens, `share` names what is linked in from the operator's own config folder, and `wait` is the minutes the person is given." }
pins = { ty = "map<str>", default = {}, doc = "For `mcp`: the hash of each tool of the server that the operator accepted, by the tool's name (the hash is over its name, its words and its schema). A tool that is not here, or whose hash has changed, is not offered to a model; when a server offers one, a proposal pins it." }
code = { ty = "bool", default = false, doc = "For `mcp`: whether the tools of the server may be called from the cells of the kit (`j4n.call`). Off by default: a server's answers are untrusted and its effects are outside J4n; with it on they are reachable under the Gate as a model's call is (the same pins, one Gate question per call), and a page of theirs taints the run." }
