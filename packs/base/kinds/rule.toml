api = 1

# A reaction to something that happened. When an event of kind `on` is written and `when` holds, the
# rule does `then`: start a task, steer one, say something, park one, or cool one. Everything else a rule might want (kill,
# change a Gate, spend) is not offered: a rule proposes and the loop acts. A rule only reads: its `when` and its words see the
# event (`ev`, or its fields by name: `kind task thread by data …`), the folds (`fold.tasks[task].auto`) and the settings
# (`set.loop.followups`). The words a rule says never carry what a doer or a model wrote unless `quote(…)` makes them inert, and
# a hole that reads such a field bare is refused when the rule is loaded. A rule answers an event once; the actions it takes
# carry the event as their cause, and a chain of rules ends at a depth of 8. A rule in a project nobody trusted does not run.
[[kind]]
id = "rule"
doc = "When this happens and that holds, do this: the loop's reactions, written as data."
untrusted = "ignore"
examples = [
  { id = "again", doc = "A task that ended with work left is carried on in its own session.", on = "task.settled", when = "ev.data.todo_left > 0 and fold.tasks[task].auto < set.loop.followups", then = "start", follow = true, text = "{ev.data.todo_left} item(s) are still open. Carry on and finish them." },
  { id = "compact-junk", doc = "A reflex: shrink the session when much of it is junk, if the judge agrees.", on = "task.settled", when = "ctx.grew >= 0.01", then = "ask", text = "the context holds more than a twentieth of junk", do = ":compact junk", limit = { per = "thread", max = 1, within = "10m" }, off = true },
  { id = "quiet", doc = "Nothing was heard of a running task for five minutes.", on = "run.*", then = "notice", text = "Nothing has been heard from this task for 5 minutes.", after = "5m", limit = { per = "task", max = 3 } },
]

[kind.fields]
doc = { ty = "text", doc = "What the rule is for." }
on = { ty = "pattern", required = true, doc = "The event kinds it reacts to, a glob (`task.*`). Written events and flashed ones alike." }
when = { ty = "expr", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set", "ctx"], doc = "It reacts only when this holds; left out, always. `ctx` (the numbers of `/context`: held, window, floor, history, grew, cold, turns) is read for a rule that asks only." }
then = { ty = "enum:start|steer|notice|control|cool|ask|propose|label", required = true, doc = "What it does. `label` writes a `label` event, what happened to a machine's answer. `propose` makes a proposal: a change to the Table that waits for the operator's yes (`:accept`, Tab) and is never made by the rule itself. A rule that starts a flow or a doer is `start`. `ask` is a reflex: at a settled boundary (`on` is `task.settled` or `chat.say`) the front puts the sentence in `text` to the judge when `when` holds, and runs `do` if it says yes; the loop never reads it, it needs `when` and a `limit` per thread, and it runs only while the setting `reflexes.on` is on. A question of a flow is asked by the flow's `ask` step." }
text = { ty = "fmt", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"], doc = "The words: the goal of a task that is started, the steer, the notice; for `ask`, the operator's sentence, which the judge reads." }
do = { ty = "str", doc = "For `ask`: the command that runs when the judge says the sentence holds: `:compact junk`, `:fresh`, `:new`, `:context`. A reflex never runs anything that widens what J4n may do (a setting, an acceptance, a task), and one that throws context away (`:compact`, `:fresh`, `:new`) asks the operator until its calls have held." }
off = { ty = "bool", default = false, doc = "The rule is read and checked and does nothing. A shipped reflex is off; `:reflex on <id>` turns one on." }
follow = { ty = "bool", default = false, doc = "For `start`: carry on the task of the event in its own session, instead of beginning a new one." }
doer = { ty = "str", doc = "For `start` without `follow`: who does it. Left out: the doer of the task of the event." }
place = { ty = "str", doc = "For `start` without `follow`: where it works. `@same` is the place the task of the event worked in (a check run where the work was done); left out, the place of that task." }
detached = { ty = "bool", default = false, doc = "For `start` without `follow`: the task belongs to no thread. A task that works beside the operator's lines (a spot check) is not the thread's last task, and a line typed does not steer it." }
compact = { ty = "bool", default = false, doc = "For `start` with `follow`: have the session shrunk first, at this settled boundary and nowhere else, keeping what the loop knows must stay (the goal, what is left to do, what was decided, what changed) and `keep`. A doer that cannot compact goes on without, and says so." }
keep = { ty = "list", of = { ty = "fmt", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"] }, default = [], doc = "For `compact`: notes added after what the loop keeps (up to 6 of 200 characters); they never replace it." }
control = { ty = "enum:park", doc = "For `control`: `park` stops the task, keeping its session, so that it can be carried on from the menu." }
cool_for = { ty = "expr", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"], doc = "For `cool`: how long the task waits before it goes on by itself, a duration." }
after = { ty = "dur", doc = "Wait this long after the last matching event of the same task before acting; a newer match starts the wait again, and so does the task beginning or ending a wait for an answer. A task that ends in the meantime takes the action with it." }
limit = { ty = "obj", fields = { per = "enum:task|thread|all", max = { ty = "int", min = 1, required = true }, within = "dur" }, doc = "At most `max` actions per task (the default), thread or all, in the last `within` (left out: ever)." }
label = { ty = "obj", doc = "For `label`: the event written. `subject`, `producer`, `model` and `point` are templates over the event.", fields = { is = { ty = "str", required = true }, of = "enum:answer|shape_item|qc_mark", subject = { ty = "fmt", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"], required = true }, producer = { ty = "fmt", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"], required = true }, model = { ty = "fmt", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"] }, point = { ty = "fmt", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"] }, weight = { ty = "num", min = 0, max = 1 } } }
propose = { ty = "obj", doc = "For `propose`: one write to the Table, proposed. `key` says it is the same proposal when it comes again (an open one only gains evidence; a declined one returns when `evidence` has doubled), `title` and `why` are what the operator reads (counts, not a doer's words), `kind` and `id` name the entry, `set` gives fields: a value as it stands, text with holes (a template), or text that begins with `=` (an expression, so a number or a list read from a fold stays one), `unset` takes fields out, `remove` takes the entry out.", fields = { key = { ty = "fmt", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"], required = true }, title = { ty = "fmt", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"], required = true }, why = { ty = "fmt", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"], required = true }, evidence = { ty = "expr", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"], doc = "A count; left out, 1." }, to = "enum:home|project", file = "str", kind = { ty = "str", required = true }, id = { ty = "fmt", roots = ["ev", "event", "seq", "at_ms", "kind", "task", "thread", "by", "cause", "class", "data", "fold", "set"], required = true }, set = "map<any>", unset = "list<str>", remove = "bool" } }
cooldown = { ty = "dur", doc = "At least this long between two actions for the same task." }
