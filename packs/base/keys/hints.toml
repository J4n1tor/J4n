api = 1

# The keys row (kind `hint`): the keys of the page that is open, glyph first, a few words, the most used first. The
# place in the id says whose they are (`global`, the field of the page, `ask` for the open question, `page:<id>` for one page); the same
# name nearer the page wins, and an empty `word` hides it. A file of the operator's under `~/.j4n/ui/` and the look file say other orders
# and other words. `look.keys_row` (settings) turns the row off.

# ---- global ----

[[hint]]
id = "global/tabs"
doc = "Tab n. On a Mac, let the terminal send Option as Meta or Alt."
keys = "⌥1–9"
word = "tabs"
order = 10

[[hint]]
id = "global/find"
doc = "Find anything: the commands and the tree."
keys = "⌃k"
word = "find"
order = 95

[[hint]]
id = "global/bar"
doc = "Turn the bottom row over: the keys, or what the whole screen is doing (tasks, what waits for you, today's spend, a window that runs low)."
keys = "⌃g"
word = "state"
order = 97

[[hint]]
id = "global/keys"
doc = "All the keys of this page."
keys = "?"
word = "keys"
order = 90

# ---- chat ----

[[hint]]
id = "chat/send"
doc = "Send the line."
keys = "⏎"
word = "send"
order = 20

[[hint]]
id = "chat/newline"
doc = "A new line in the draft."
keys = "⌃j"
word = "newline"
order = 30

[[hint]]
id = "chat/history"
doc = "An older line of the history, while the line is empty."
keys = "↑"
word = "history"
order = 40

# Shown only while the chat has a turn with several lanes of which one is over (it folds), or a chat's end with a preview (`lanes`): the way
# to a folded lane was on no screen.
[[hint]]
id = "lanes/open"
doc = "Put the keys on a lane or a chat's end: `⌃↑` takes the newest, `↑` `↓` walk, `⏎` or `space` opens it, `z` opens or shuts all, `esc` gives the keys back to the line."
keys = "⌃↑"
word = "select · ⏎ open"
order = 45

[[hint]]
id = "chat/scroll"
doc = "Scroll the chat a line, from the line; PgUp and PgDn go half a screen."
keys = "⇧↑↓"
word = "scroll"
order = 96

[[hint]]
id = "chat/select"
doc = "Select the screen's text with the mouse: hold ⇧ while you drag, because the mouse is the screen's (Settings › Look › mouse gives it back to the terminal)."
keys = "⇧drag"
word = "select"
order = 98

[[hint]]
id = "chat/lane"
doc = "Steer the next lane that works."
keys = "⌃t"
word = "lane"
order = 50

[[hint]]
id = "sub/main"
doc = "Back to the orchestrator, the main chat, while the line is empty; with text `←` moves the cursor."
keys = "←"
word = "main"
order = 25

# ---- Tab completes: the nearest place while the rest of a suggestion stands after the cursor (`ghost`), and while Tab steps through
# the list (`step`). Their orders put them first in the row; a `step` hint of the line's name rewords it (`⏎ keep`) or hides it (no word).
# The `?` sheet of a chat lists both, each key once. ----

[[hint]]
id = "ghost/take"
doc = "Take it whole; ⇥ again, the next one."
keys = "⇥"
word = "take"
order = 1

[[hint]]
id = "ghost/word"
doc = "Take one word of it."
keys = "⌃→"
word = "word"
order = 2

[[hint]]
id = "step/next"
doc = "The next suggestion."
keys = "⇥"
word = "next"
order = 3

[[hint]]
id = "step/back"
doc = "The suggestion before."
keys = "⇧⇥"
word = "back"
order = 4

[[hint]]
id = "step/send"
doc = "Keep it; ⏎ again sends."
keys = "⏎"
word = "keep"
order = 5

[[hint]]
id = "step/undo"
doc = "Put back what was typed."
keys = "esc"
word = "undo"
order = 6

[[hint]]
id = "step/newline"
keys = "⌃j"
word = ""
order = 7

[[hint]]
id = "step/history"
keys = "↑"
word = ""
order = 8

# ---- the list of the chats, while it has the keys (`↓` on an empty line; four seconds with no key hand them back) ----
# Only these show then: the line's keys would not do what they say.

[[hint]]
id = "pick/move"
doc = "The chat above or below; `↑` on the first one goes back to the line."
keys = "↑↓"
word = "move"
order = 10

[[hint]]
id = "pick/open"
doc = "Go into the chat."
keys = "⏎ ⇥"
word = "open"
order = 20

[[hint]]
id = "pick/archive"
doc = "Archive the chat the cursor is on, or bring it back from the archive (`:archive`, `:unarchive`)."
keys = "a"
word = "archive"
order = 25

[[hint]]
id = "pick/back"
doc = "Give the keys back to the line, opening nothing."
keys = "esc"
word = "back"
order = 30

# ---- the open question (the keys of the answer; `?` is why) ----
# Its hints stand before the chat's (orders 12–18): on a narrow screen the row drops from the right, and a question's keys matter more than the line's.

[[hint]]
id = "ask/pick"
doc = "Answer with the option of that number."
keys = "1–9"
word = "answer"
order = 12

[[hint]]
id = "ask/recommended"
doc = "Take the answer the core recommends."
keys = "→"
word = "hint"
order = 14

[[hint]]
id = "ask/why"
doc = "Say why the risk is what it is."
keys = "?"
word = "why"
order = 16

[[hint]]
id = "ask/later"
doc = "Put the question off; it holds."
keys = "esc"
word = "later"
order = 18

[[hint]]
id = "ask/keys"
doc = "While a question is open `?` says why: the sheet waits."
keys = "?"
word = ""
order = 90

