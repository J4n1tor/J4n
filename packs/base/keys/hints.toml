keys = "u"
word = "undo"
order = 35

[[hint]]
id = "page:look/undo"
doc = "Take back your last change of the row (`:undo eN`)."
keys = "u"
word = "undo"
order = 35

[[hint]]
id = "page:loop/undo"
doc = "Take back your last change of the row (`:undo eN`)."
keys = "u"
word = "undo"
order = 35

[[hint]]
id = "page:config/undo"
doc = "Take back your last change of the row (`:undo eN`)."
keys = "u"
word = "undo"
order = 35

[[hint]]
id = "page:gates/back"
doc = "Take the grant back: what it let through is asked again."
keys = "x"
word = "take back"
order = 35

[[hint]]
id = "page:system/find"
doc = "Find in the rows, as you type; ⏎ keeps it, esc clears it."
