# ---- ask: a question that waits ----

[[key]]
id = "ask/pick"
doc = "Answer with the option of that number, 1–9."
native = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

[[key]]
id = "ask/recommended"
doc = "Take the answer the core recommends: ⇥ on an empty line, → at the end of the line, ⌃→ wherever the cursor is. ⇥ never types."
native = ["C-Right", "Right", "Tab"]

[[key]]
id = "ask/change"
doc = "Open the change an approval would make."
native = ["Enter"]

[[key]]
id = "ask/why"
doc = "Say why the risk is what it is."
native = ["?"]

[[key]]
id = "ask/prev"
doc = "The question before."
native = ["Up"]

[[key]]
id = "ask/next"
doc = "The next question."
native = ["Down"]

[[key]]
id = "ask/later"
doc = "Put the question off; it holds."
native = ["Esc"]
