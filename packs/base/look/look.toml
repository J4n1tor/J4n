api = 1

# The built-in look file (the kind `look`, `kinds/look.toml`): how the Log shows each kind of event J4n
# writes, and its fields. It is the look table as data, with a family for every kind the code and the packs write today, so no
# kind of J4n's own falls to the bare look (`family/`). Over it: what the look's pass made, then the operator's `~/.j4n/ui/look.toml`.

# ---- families: a kind prefix → its glyph slot and colour role; the longest prefix wins ----

[[look]]
id = "family/"
doc = "A kind no family has."
glyph = "control"
role = "faint"

