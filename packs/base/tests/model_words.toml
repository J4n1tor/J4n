# Model words against real lists: what `pi --list-models` printed on 2026-10-31 (a cut of it), the
# models an openai-shaped endpoint lists, and the words claude takes. Run by `front_models` in crates/j4n-core/tests/core.
# A case says the word, the list, and one of: `one` (the model it picks), `many` (the choice, the suggested one first),
# `none` (refused; `near` are the nearest three by edit distance).

