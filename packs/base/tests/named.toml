# Lines against `rule:named`: which doer a line names in exact syntax (`@doer` or `doer:` at the start), and the words after it that may name its model. Run by
# `front_named` in crates/j4n-core/tests/core. A case says the `line` and either `doer` (and `words`, optional) or nothing: the line names no doer in exact syntax,
# and a doer taken for it is a false positive. A doer's name inside a sentence (`use pi with deepseek`, `ask claude opus`) names nothing here: the read settles it.

doers = ["claude", "pi", "omp", "own", "test"]

[[case]]
line = "@pi deepseek 4.1 to build a game"
doer = "pi"
words = "deepseek 4.1"

