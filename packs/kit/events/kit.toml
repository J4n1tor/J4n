api = 1

[[event]]
id = "py.cell"
doc = "A cell of the tool `py` ran: the code is in the blob `blob`, `head` is its first 200 characters and `hash` names it. `risk` is `read` for a cell the Gate's `pyread` reads, else `exec`; `walled` says the kernel was behind a box. `out`, `value` and `error` are what the kernel answered, each cut at 4,000 characters. `host` lists the host calls the cell made: for each the call, `ok`, `ms`, and for a decider `requests`, `items`, `failed`, `tokens_in`, `tokens_out` and `usd` (null where the provider names no price), for a model its `model` and tokens; an `error` says why a call was refused or failed. `names` lists the variables the kernel holds after the cell, `mem` the most memory the kernel has held (KiB), `up` how many seconds it has been alive; `calls` says the host calls in one line, with their time and tokens; `via` is `j4n py` for a cell that came from an agent's shell over the task's socket. `used` says which parts of the library the cell called, as {part: times} (a recipe is `recipe` and `recipe:<name>`, a part calling another is not counted); `{}` is a cell that used none, and a cell from an older version has no `used` at all."
fields = { blob = { ty = "str" }, head = { ty = "str", required = true }, hash = { ty = "str", required = true }, risk = { ty = "str", required = true }, ok = { ty = "bool", required = true }, ms = { ty = "int" }, out = { ty = "str" }, value = { ty = "str" }, error = { ty = "str" }, walled = { ty = "bool" }, host = { ty = "any" }, calls = { ty = "str" }, names = { ty = "any" }, mem = { ty = "int" }, up = { ty = "int" }, via = { ty = "str" }, used = { ty = "any" } }
