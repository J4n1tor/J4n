name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: target
        run: rustup target add ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p j4n --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name=j4n-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/j4n .
          cp docs/THIRD-PARTY.md .
          tar -czf "$name.tar.gz" j4n LICENSE README.md THIRD-PARTY.md
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: j4n-${{ matrix.target }}
          path: j4n-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: j4n-*.tar.gz*
          prerelease: true
          generate_release_notes: true
